<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Clipboard body -->
  <rect x="24" y="20" width="80" height="88" rx="10" fill="white" fill-opacity="0.95"/>
  
  <!-- Clipboard clip -->
  <rect x="44" y="14" width="40" height="16" rx="6" fill="url(#grad2)"/>
  
  <!-- Lines representing text -->
  <rect x="34" y="42" width="60" height="6" rx="3" fill="#e0e7ff"/>
  <rect x="34" y="54" width="48" height="6" rx="3" fill="#c7d2fe"/>
  <rect x="34" y="66" width="56" height="6" rx="3" fill="#e0e7ff"/>
  <rect x="34" y="78" width="40" height="6" rx="3" fill="#c7d2fe"/>
  <rect x="34" y="90" width="52" height="6" rx="3" fill="#e0e7ff"/>
  
  <!-- Small unlock icon overlay -->
  <circle cx="96" cy="96" r="20" fill="#22c55e"/>
  <path d="M88 96 L94 102 L104 90" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>