<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCR</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #18181b;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #09090b;
        color: #fafafa;
      }
    }

    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #ffffff;
      --bg-secondary: #f4f4f5;
      --bg-tertiary: #e4e4e7;
      --border: #e4e4e7;
      --text: #18181b;
      --text-secondary: #71717a;
      --text-muted: #a1a1aa;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --bg-secondary: #18181b;
        --bg-tertiary: #27272a;
        --border: #27272a;
        --text: #fafafa;
        --text-secondary: #a1a1aa;
        --text-muted: #71717a;
      }
    }

    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      width: 24px;
      height: 24px;
      background: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 10px;
      font-weight: 700;
    }

    .title {
      font-size: 14px;
      font-weight: 600;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--text-muted);
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    .search {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: var(--radius);
      background: var(--bg-secondary);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .search-input:focus {
      box-shadow: 0 0 0 2px var(--primary);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .items-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .items-header {
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .item {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .item:hover {
      border-color: var(--primary);
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .item-type {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--bg-secondary);
      color: var(--text-secondary);
    }

    .item-type.link {
      background: #dbeafe;
      color: #2563eb;
    }

    @media (prefers-color-scheme: dark) {
      .item-type.link {
        background: #1e3a5f;
        color: #60a5fa;
      }
    }

    .item-type.code {
      background: #f3e8ff;
      color: #7c3aed;
    }

    @media (prefers-color-scheme: dark) {
      .item-type.code {
        background: #3b0764;
        color: #a78bfa;
      }
    }

    .item-source {
      font-size: 9px;
      color: var(--text-muted);
    }

    .item-text {
      font-size: 11px;
      line-height: 1.4;
      color: var(--text);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      font-family: ui-monospace, monospace;
      word-break: break-all;
    }

    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .empty-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .empty-text {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .footer {
      padding: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .open-dashboard {
      font-size: 12px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .open-dashboard:hover {
      text-decoration: underline;
    }

    .settings-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .settings-btn:hover {
      background: var(--bg-secondary);
      color: var(--text);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <div class="logo">SCR</div>
      <span class="title">Safari Restore</span>
    </div>
    <div class="sync-status">
      <div class="sync-dot"></div>
      <span>Synced</span>
    </div>
  </header>

  <div class="search">
    <input type="text" class="search-input" placeholder="Search clipboard..." id="searchInput">
  </div>

  <div class="items-container" id="itemsContainer">
    <p class="items-header">Recent Clips</p>
    <div id="itemsList"></div>
  </div>

  <footer class="footer">
    <a href="#" class="open-dashboard" id="openDashboard">Open Full Dashboard</a>
    <button class="settings-btn" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
      </svg>
    </button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
