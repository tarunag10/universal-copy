<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Copy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #818cf8;
      --bg: #0f0f23;
      --bg-card: #1a1a2e;
      --bg-hover: #252542;
      --border: #2e2e5a;
      --text: #f8fafc;
      --text-secondary: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    @media (prefers-color-scheme: dark) {
      body { background: var(--bg); color: var(--text); }
    }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container { padding: 16px; }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* Toggle Button */
    .toggle-btn {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .toggle-btn.locked {
      background: linear-gradient(135deg, var(--danger), #dc2626);
    }

    .toggle-btn.unlocked {
      background: linear-gradient(135deg, var(--success), #16a34a);
    }

    .toggle-btn:hover {
      transform: scale(1.02);
    }

    .toggle-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toggle-icon {
      font-size: 22px;
    }

    .toggle-label {
      font-size: 15px;
      font-weight: 700;
      color: white;
    }

    .toggle-hint {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
    }

    /* Quick Actions Grid */
    .section-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .action-btn:hover {
      background: var(--bg-hover);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .action-btn:active {
      transform: scale(0.95);
    }

    .action-icon {
      font-size: 18px;
    }

    .action-label {
      font-size: 9px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Tools Grid */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text);
    }

    .tool-btn:hover {
      background: var(--bg-hover);
      border-color: var(--primary);
    }

    .tool-icon {
      font-size: 20px;
    }

    .tool-label {
      font-size: 11px;
      font-weight: 500;
    }

    /* Stats */
    .stats-section {
      margin: 16px 0;
      padding: 12px;
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary-light);
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-secondary);
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }

    .footer-link {
      font-size: 12px;
      color: var(--primary-light);
      text-decoration: none;
    }

    .footer-link:hover {
      text-decoration: underline;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-card);
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      border: 1px solid var(--border);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success {
      border-color: var(--success);
    }

    .toast.error {
      border-color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <div class="logo-img">SCR</div>
        <div>
          <div class="logo-text">Universal Copy</div>
          <div class="logo-sub">Unlock & Copy Tools</div>
        </div>
      </div>
    </header>

    <button class="toggle-btn locked" id="unlockToggle">
      <div class="toggle-left">
        <span class="toggle-icon" id="unlockIcon">🔒</span>
        <div>
          <div class="toggle-label" id="unlockText">LOCKED</div>
          <div class="toggle-hint" id="unlockHint">Click to unlock</div>
        </div>
      </div>
    </button>

    <div class="section-title">Quick Actions</div>
    <div class="actions-grid">
      <button class="action-btn" data-action="unlock">
        <span class="action-icon">🔓</span>
        <span class="action-label">Unlock</span>
      </button>
      <button class="action-btn" data-action="copyAll">
        <span class="action-icon">📋</span>
        <span class="action-label">Copy</span>
      </button>
      <button class="action-btn" data-action="cleanText">
        <span class="action-icon">✨</span>
        <span class="action-label">Clean</span>
      </button>
      <button class="action-btn" data-action="cleanUrl">
        <span class="action-icon">🔗</span>
        <span class="action-label">URL</span>
      </button>
      <button class="action-btn" data-action="extractImages">
        <span class="action-icon">🖼️</span>
        <span class="action-label">Img</span>
      </button>
      <button class="action-btn" data-action="performOCR">
        <span class="action-icon">📷</span>
        <span class="action-label">OCR</span>
      </button>
    </div>

    <div class="section-title">Tools</div>
    <div class="tools-grid">
      <button class="tool-btn" data-tool="clean">
        <span class="tool-icon">✨</span>
        <span class="tool-label">Clean Text</span>
      </button>
      <button class="tool-btn" data-tool="url">
        <span class="tool-icon">🔗</span>
        <span class="tool-label">Clean URL</span>
      </button>
      <button class="tool-btn" data-tool="snippets">
        <span class="tool-icon">📝</span>
        <span class="tool-label">Snippets</span>
      </button>
    </div>

    <div class="stats-section">
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-value" id="totalUnlocks">0</div>
          <div class="stat-label">Total Unlocks</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="sitesUnlocked">0</div>
          <div class="stat-label">Sites Unlocked</div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <a href="#" class="footer-link" id="openDashboard">Open Dashboard</a>
      <a href="#" class="footer-link" id="openSettings">Settings</a>
    </footer>
  </div>

  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
